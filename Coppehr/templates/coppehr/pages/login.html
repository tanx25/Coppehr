{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>COPPEhR</title>
  <meta content="" name="description">
  <meta content="" name="keywords">
  <!-- Favicons -->
  <link href="{% static 'assets/images/site/favicon.png' %}" rel="icon">
  <link href="{% static 'assets/images/site/apple-touch-icon.png' %}" rel="apple-touch-icon">
  <!-- Google Fonts -->
  <!-- NEW -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <!-- Vendor CSS Files -->
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">
  <link href="{% static 'assets/vendor/aos/aos.css' %}" rel="stylesheet">
  <!-- Template Main CSS Files -->
  <link href="{% static 'assets/css/variables.css' %}" rel="stylesheet">
  <link href="{% static 'assets/css/main.css' %}" rel="stylesheet">
</head>
<body>
  <!-- ======= Header ======= -->

  <!-- End Header -->
  <!-- ======= Main ======= -->
  <main id="main">
    <div class="container" data-aos="fade-up">
      <div class="row">
        <div class="col-1 col-sm-2 col-lg-4"></div>
        <div class="login-form col-10 col-sm-8 col-lg-4">
          {% if errors %}
          <p class="alert alert-warning mb-3 role=alert">{{errors}}</p>
          {% endif %}
          <p class="login-header">
            <span>Enhancing</span> HEALTH<br>
            <span>&</span> RESILIENCE
          </p>
          <form method="POST">
            {% csrf_token %}
            {% for field in form %}
              {{ field.errors }}
              <div>{{ field.label_tag }}</div>
              <div>{{ field }}</div>
              {%if forloop.first %}
              <div style="margin-top: 72px;"></div>
              {% endif %}
            {%endfor %}
            <div style="margin-top: 120px;"></div>
            <input class="form-control btn btn-primary btn-dark" type="submit" value="Login">
          </form>
        </div>
        <div class="col-1 col-sm-2 col-lg-4"></div>
      </div>
    </div>
  </main>
  <!-- End Main -->
  <!-- End Footer -->
  <a href="#" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>
  <!-- Vendor JS Files -->
  <script src="{% static 'assets/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/vendor/swiper/swiper-bundle.min.js' %}"></script>
  <script src="{% static 'assets/vendor/glightbox/js/glightbox.min.js' %}"></script>
  <script src="{% static 'assets/vendor/aos/aos.js' %}"></script>
  <script src="{% static 'assets/vendor/php-email-form/validate.js' %}"></script>
  <!-- Main JS File -->
  <script src="{% static 'assets/js/main.js' %}"></script>
</body>
</html>
